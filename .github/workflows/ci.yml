name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Replay tests run against the recorded fixtures, and the fuzz target's
      # seed corpus is those same fixtures, so this exercises real traffic.
      - name: Test
        run: go test ./...

      - name: Fuzz chunk reassembly
        run: go test ./internal/responses/ -run=NONE -fuzz=FuzzToolCallChunkSplits -fuzztime=30s
